# scalafmt configuration. Mirrors the sister project `eo`
# (https://github.com/Constructive-Programming/eo) so the two codebases read
# the same way. The `version` pin drives the formatter the sbt-scalafmt plugin
# downloads; CI checks with `sbt scalafmtCheckAll scalafmtSbtCheck`.
version = "3.11.5"
runner.dialect = scala3

maxColumn = 100
lineEndings = unix

# Vertical alignment is pretty, but leads to bigger diffs.
align.preset = some

newlines.topLevelStatements = [before, after]
newlines.beforeCurlyLambdaParams = multilineWithCaseOnly

danglingParentheses.callSite = true
danglingParentheses.defnSite = true
danglingParentheses.ctrlSite = true

# `RedundantBraces` is deliberately absent: it misparses the specs2
# `"…" should { … }` DSL in the test sources as orphan parens. The rules
# below are safe for both the specs2 suites and the production sources.
#
# Import sorting belongs to scalafix's `OrganizeImports` (see `.scalafix.conf`),
# so scalafmt stays out of it (`keep` rather than `multiple`) and the two tools
# never fight over the trailing comma scalafix writes.
rewrite.rules = [
  AvoidInfix
  RedundantParens
  SortModifiers
  PreferCurlyFors
]
trailingCommas = keep
