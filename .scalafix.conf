# Scalafix rule set. Mirrors the sister project `eo`
# (https://github.com/Constructive-Programming/eo) — built-in semantic rules
# plus typelevel-scalafix's cats-module rules, with `DisableSyntax` banning the
# patterns this codebase deliberately avoids.
#
# SemanticDB exports are wired in build.sbt (`semanticdbEnabled`); the rules
# run through the scalafix classloader against the 2.13 binary version, so
# `typelevel-scalafix` resolves as a `_2.13` artifact even though this project
# compiles on Scala 3. CI checks with `sbt scalafixAll --check`; developers run
# `sbt scalafixAll` to auto-fix.
rules = [
  RemoveUnused
  OrganizeImports
  RedundantSyntax
  DisableSyntax
  TypelevelMapSequence
  TypelevelAs
]

OrganizeImports {
  // `RemoveUnused` already handles unused-import deletion; per the
  // OrganizeImports docs the two must not both try to do it.
  removeUnused = false

  // Scala 3 dialect: emit `*` wildcards and `as` renames instead of `_`/`=>`.
  targetDialect = Scala3

  // Stdlib first, then third-party / intra-project catch-all.
  groups = [
    "scala."
    "java(x)?."
    "*"
  ]

  importSelectorsOrder = SymbolsFirst
  blankLines = Auto
  groupedImports = Merge
}

DisableSyntax {
  // No XML literals, no `finalize()` overrides, no `return`: all three are
  // JVM/imperative idioms this functional codebase does not use.
  noXml = true
  noFinalize = true
  noReturns = true

  // `var` / `null` are not used today, but leaving the bans off keeps the rule
  // set from flagging the deliberate `var`-free numeric code if it ever needs
  // a local accumulator. Flip these on when a mutable hot path appears.
  noVars = false
  noNulls = false

  // The `Size` algebra overrides `equals` with universal equality on its
  // primitive representations; enabling this would require threading
  // `CanEqual` witnesses through every override.
  noUniversalEquality = false
}
