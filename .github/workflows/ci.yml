# Continuous Integration: the fast, always-on gates.
#
#   - scalafmt  — formatting (check only)
#   - scalafix  — semantic rewrites (check only)
#   - scoverage — statement-coverage regression floor
#   - cpd       — duplicate-code detection
#
# The heavier / external signals (stryker4s mutation testing, CodeScene Code
# Health) live in `quality.yml`, a separate workflow that also runs on pull
# requests, so they never slow down these gates.
#
# The `report` job posts every gate's result, pass or fail, to the pull request
# as one comment that is edited in place on each push.
#
# Hand-written rather than generated by sbt-github-actions: this is a single
# module, and a readable workflow is worth more than the generator indirection.
# The sister project `eo` splits the same tools the same way (generated
# `ci.yml` for gates, hand-written `quality.yml` for reports).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      scalafmt: ${{ steps.scalafmt.outcome }}
      scalafix: ${{ steps.scalafix.outcome }}
      coverage: ${{ steps.coverage.outcome }}
      statements: ${{ steps.rates.outputs.statements }}
      branches: ${{ steps.rates.outputs.branches }}
      floor: ${{ steps.rates.outputs.floor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Check formatting (scalafmt)
        id: scalafmt
        run: sbt -batch 'scalafmtCheckAll; scalafmtSbtCheck'

      - name: Check scalafix
        id: scalafix
        run: sbt -batch 'scalafixAll --check'

      # `coverageAll` = clean; coverage; test; coverageReport. Tests run under
      # instrumentation and the run fails if statement coverage drops below the
      # floor set in build.sbt (`coverageMinimumStmtTotal`).
      - name: Test with coverage (scoverage)
        id: coverage
        run: sbt -batch coverageAll

      # Rates for the PR report. They stay empty when no scoverage.xml was
      # written: the tests failed, or sbt served the run from its cache.
      - name: Read coverage rates
        id: rates
        if: ${{ !cancelled() }}
        run: |
          echo "floor=$(grep -oP 'coverageMinimumStmtTotal := \K\d+' build.sbt)" >> "$GITHUB_OUTPUT"
          xml=$(find target -path '*scoverage-report/scoverage.xml' 2>/dev/null | head -1)
          if [ -n "$xml" ]; then
            echo "statements=$(grep -oP 'statement-rate="\K[\d.]+' "$xml" | head -1)" >> "$GITHUB_OUTPUT"
            echo "branches=$(grep -oP 'branch-rate="\K[\d.]+' "$xml" | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoverage-report
          path: '**/scoverage-report/**'
          retention-days: 14
          if-no-files-found: warn

  cpd:
    name: Duplicate code (CPD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.cpd.outcome }}
      report: ${{ steps.cpd.outputs.report }}
    env:
      # PMD ships CPD; version pinned so the report is reproducible. There is no
      # sbt-2-compatible `sbt-cpd` plugin (that project stopped at PMD 5.8.1 /
      # sbt 1.0), so we run the CPD CLI directly.
      PMD_VERSION: '7.27.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java (temurin 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache PMD
        uses: actions/cache@v6
        with:
          path: ~/pmd
          key: pmd-${{ env.PMD_VERSION }}

      - name: Install PMD
        run: |
          if [ ! -d "$HOME/pmd/pmd-bin-$PMD_VERSION" ]; then
            curl -sSL -o /tmp/pmd.zip \
              "https://github.com/pmd/pmd/releases/download/pmd_releases/${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
            unzip -q /tmp/pmd.zip -d "$HOME/pmd"
          fi

      # CPD exits non-zero when it finds a duplicate above the token threshold,
      # so this is a gate. `src/main/scala` only: duplication between tests is
      # usually deliberate. The report goes to the `report` job base64-encoded,
      # which keeps it a one-line output whatever the duplicated code contains.
      - name: Run CPD
        id: cpd
        run: |
          set +e
          "$HOME/pmd/pmd-bin-$PMD_VERSION/bin/pmd" cpd \
            --minimum-tokens=100 \
            --language=scala \
            --dir=src/main/scala \
            --format=text > cpd.txt
          status=$?
          cat cpd.txt
          echo "report=$(sed "s#$PWD/##" cpd.txt | base64 -w0)" >> "$GITHUB_OUTPUT"
          exit $status

  # Writes the results above to the run summary and, on pull requests, to one
  # comment edited in place. A separate job so the jobs that run the PR's build
  # never hold a token that can write to the PR. Pull requests from forks only
  # get a read-only token, so they get the summary but no comment.
  report:
    name: Report
    needs: [build, cpd]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      MARKER: '<!-- ci-report -->'
    steps:
      # Outputs arrive through env, never `${{ }}` inside the script, because
      # the CPD report quotes code from the pull request.
      - name: Write report
        env:
          SCALAFMT: ${{ needs.build.outputs.scalafmt }}
          SCALAFIX: ${{ needs.build.outputs.scalafix }}
          COVERAGE: ${{ needs.build.outputs.coverage }}
          STATEMENTS: ${{ needs.build.outputs.statements }}
          BRANCHES: ${{ needs.build.outputs.branches }}
          FLOOR: ${{ needs.build.outputs.floor }}
          CPD: ${{ needs.cpd.outputs.result }}
          CPD_REPORT: ${{ needs.cpd.outputs.report }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          icon() { case "$1" in success) echo '✅' ;; failure) echo '❌' ;; *) echo '⏭️' ;; esac; }
          line() { echo "| $1 | $(icon "$2") ${3:-${2:-not run}} |"; }
          # shellcheck disable=SC2016 # backticks below are markdown, not substitutions
          {
            echo "$MARKER"
            echo "### CI · \`${HEAD_SHA:0:7}\`"
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            line 'Formatting (scalafmt)' "$SCALAFMT"
            line 'Semantic rules (scalafix)' "$SCALAFIX"
            if [ "$COVERAGE" = success ] && [ -z "$STATEMENTS" ]; then
              echo '| Tests + coverage (scoverage) | ⚠️ passed without a coverage report (sbt cache hit?) |'
            else
              line 'Tests + coverage (scoverage)' "$COVERAGE" \
                "${STATEMENTS:+$STATEMENTS% statements (floor $FLOOR%), $BRANCHES% branches}"
            fi
            line 'Duplicate code (CPD)' "$CPD" "$([ "$CPD" = success ] && echo 'no duplicates over 100 tokens')"
            dups=$(echo "$CPD_REPORT" | base64 -d | head -c 20000)
            if [ -n "$dups" ]; then
              printf '\n<details><summary>CPD report</summary>\n\n```text\n%s\n```\n</details>\n' "$dups"
            fi
            echo
            echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@report.md > /dev/null
          fi
