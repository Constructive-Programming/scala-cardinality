# Publishes the documentation site to GitHub Pages, the way the organisation site
# (`Constructive-Programming/website`) does it: everything lives on the `gh-pages`
# branch, which Pages serves as-is.
#
#   - push to `main`  → the site root, https://constructive-programming.github.io/scala-cardinality/
#   - pull request    → a preview under `pr-preview/pr-<number>/`, announced with a sticky
#                       comment on the PR and removed again when the PR closes
#
# The site is built by `sbt siteRender` (the "Documentation site" job in ci.yml renders it
# on every pull request as well). Laika emits relative links, so the same output works at
# the root and under a preview directory without a base-URL setting.
#
# No secrets needed: the job's own GITHUB_TOKEN pushes to `gh-pages`. Pages has to be set
# to "Deploy from a branch" → `gh-pages` / `(root)` once, in the repository settings.
name: Deploy docs site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Every run writes to the same branch, so runs queue instead of racing on `gh-pages`.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs get a read-only token and could not push the preview.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup sbt
        if: github.event.action != 'closed'
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin 21)
        if: github.event.action != 'closed'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Render the site
        if: github.event.action != 'closed'
        run: sbt -batch siteRender

      - name: Deploy the site
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site
          publish_branch: gh-pages
          # Keeps the pr-preview/ directories maintained by the step below.
          keep_files: true
          commit_message: "Deploy ${{ github.sha }}"
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Deploy or remove the pull request preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./target/site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
