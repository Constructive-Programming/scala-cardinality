# Publishes the documentation site to Cloudflare Pages.
#
# The site itself is built by `sbt siteRender` (see the "Documentation site" job in
# ci.yml, which renders it on every pull request). This workflow adds the deployment:
#
#   - pull request   → preview deployment tagged with the head branch, plus a sticky
#                      comment on the PR with the preview URL
#   - push to `main` → preview deployment tagged `main-<sha>`
#   - tag push `v*`  → production deployment for that release
#
# Mirrors the sister project `eo` (same wrangler action, same comment, same trigger
# set). The one addition is the guard below: secrets cannot be read in an `if:`
# expression, so `CLOUDFLARE_API_TOKEN` is surfaced through `env` first and the
# workflow skips with a notice when it is absent — the pattern `quality.yml` uses for
# `CS_ACCESS_TOKEN`. Create the Pages project (`scala-cardinality-docs` by default,
# overridable with a `CLOUDFLARE_PAGES_PROJECT` repository variable) and set the two
# secrets to turn this on.
name: Deploy docs site

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Group by branch / PR so a new push to the same PR cancels the in-flight build.
  # `github.head_ref` is set on PR events; `github.ref` covers pushes and tags.
  group: deploy-site-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs never receive the secrets and would fail noisily.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `ready` gates every following step, so a half-configured repository skips the
      # deployment instead of failing inside wrangler.
      - name: Check for the Cloudflare secrets
        id: cloudflare
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy docs site::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, skipping the deployment."
            echo "Set both repository secrets, and create the"
            echo "'${{ vars.CLOUDFLARE_PAGES_PROJECT || 'scala-cardinality-docs' }}' Pages project, to publish this site."
          fi

      - name: Setup sbt
        if: steps.cloudflare.outputs.ready == 'true'
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin 21)
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Render the site
        if: steps.cloudflare.outputs.ready == 'true'
        run: sbt -batch siteRender

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `github.head_ref` is the source branch on PR events; falls back to
          # `github.ref_name` (`main`, `v0.1.0`, ...) on push events.
          command: >-
            pages deploy target/site
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'scala-cardinality-docs' }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment the preview URL on the pull request
        if: github.event_name == 'pull_request' && steps.cloudflare.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-pages-preview
          message: |
            :rocket: **Cloudflare Pages preview** for `${{ github.head_ref }}` is live:

            ${{ steps.deploy.outputs.deployment-url }}

            <sub>Built from `${{ github.event.pull_request.head.sha }}` · updated on every push.</sub>
