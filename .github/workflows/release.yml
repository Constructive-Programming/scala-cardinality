# Release to Maven Central: pushing a `v*` tag publishes `core` (scala-cardinality) and the sbt
# plugin (sbt-cardinality) under dev.constructive at the tag's version.
#
# Secrets (the same ones cats-eo releases with):
#   SONATYPE_USERNAME / SONATYPE_PASSWORD — a Central Portal user token for dev.constructive
#   PGP_SECRET — the signing key, base64-encoded; PGP_PASSPHRASE — its passphrase
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Import the signing key
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          echo "$PGP_SECRET" | base64 -d > /tmp/signing-key.gpg
          echo "$PGP_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --import /tmp/signing-key.gpg
          rm /tmp/signing-key.gpg

      - name: Publish and release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          sbt -batch core/test publishSigned sonaRelease
