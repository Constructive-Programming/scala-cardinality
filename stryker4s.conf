# sbt-stryker4s configuration. Read from the project root in HOCON format.
# Kept as a config file rather than sbt settings so the knobs sit next to the
# `mutationAll` alias in build.sbt that invokes them.
stryker4s {
  # console for the live log; html + json for the report artifacts CI uploads.
  reporters = ["console", "html", "json"]

  # Stryker is a REPORT, never a CI gate: `break = 0` means a low mutation
  # score is logged (ERROR below `low`) but never fails the build. This
  # project is small and largely a pure algebra over `Size`; a red mutation
  # run would be a false signal, not a regression.
  thresholds {
    high = 80
    low = 60
    break = 0
  }

  # No `excluded-mutations`. Unlike the sister project `eo` (where string
  # literals are just labels), the strings in `Counter.type` are the type-name
  # dispatch itself — `Type.Name("Int")` and friends are load-bearing and the
  # specs assert on them, so StringLiteral mutants are real signal here.
}
