# sbt-stryker4s configuration. Read from the project root in HOCON format.
# Kept as a config file rather than sbt settings so the knobs sit next to the
# `mutationAll` alias in build.sbt that invokes them. That alias runs
# `core/stryker`: mutants are meaningful in the core algebra, while the sbt
# plugin module's behavior lives in scripted tests stryker cannot run.
stryker4s {
  # console for the live log; html + json for the report artifacts CI uploads.
  reporters = ["console", "html", "json"]

  # Stryker is a REPORT, never a CI gate: `break = 0` means a low mutation
  # score is logged (ERROR below `low`) but never fails the build. This
  # project is small and largely a pure algebra over `Size`; a red mutation
  # run would be a false signal, not a regression.
  thresholds {
    high = 80
    low = 60
    break = 0
  }

  # No `excluded-mutations`. Unlike the sister project `eo` (where string
  # literals are just labels), the strings the front end matches class names
  # with (`"scala.Int"` and friends) are the type-name dispatch itself, and the
  # specs assert on them, so StringLiteral mutants are real signal here.

  # The size algebra, the stored side's fixed point and the report rendering; the rest of `core` is
  # covered by the coverage gate. Widen this list as the runtime allows. (Large literal tables such
  # as StdlibModel must stay out: mutating one overflows the JVM's 64 KB method limit.)
  mutate = [
    "src/main/scala/cardinality/capacity/Size.scala",
    "src/main/scala/cardinality/capacity/Fixpoint.scala",
    "src/main/scala/cardinality/reporting/*.scala"
  ]

  # Each mutant runs only the specs that exercise those files (about 20 s), not the whole core suite
  # (about 5 min, which kept a 470-mutant run from finishing in CI's time limit).
  test-filter = [
    "cardinality.capacity.SizeSpec",
    "cardinality.capacity.CardinalitySpec",
    "cardinality.capacity.ArticleCardinalitySpec",
    "cardinality.capacity.StoredValueSoundnessSpec",
    "cardinality.compiled.StoredRecursionSpec",
    "cardinality.compiled.ReasonSpellingSpec",
    "cardinality.reporting.ReportSpec",
    "cardinality.reporting.ReportHygieneSpec",
    "cardinality.reporting.SourcesJarSpec"
  ]
}
